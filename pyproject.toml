[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "raytracing"
version = "1.0.1"
description = "Point-ray multipath and Gaussian-beam electromagnetic solvers in C++ with a Python API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["numpy>=2.3"]

[project.optional-dependencies]
viz = ["matplotlib>=3.10", "pyvista>=0.49"]
dev = ["pytest>=8", "matplotlib>=3.10", "pyvista>=0.49"]

[tool.scikit-build]
cmake.version = ">=4.2"
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
wheel.packages = ["python/raytracing"]

[tool.scikit-build.cmake.define]
RAYTRACING_BUILD_PYTHON = "ON"

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.uv]
# Keep IDE launches on the explicitly installed wheel in the existing .venv.
managed = false
