[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "raytracing"
version = "0.3.0"
description = "Electromagnetic ray tracing with a C++ numerical core and Matplotlib/PyVista visualization"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["numpy>=2.3", "matplotlib>=3.10", "pyvista>=0.49"]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4", "ipykernel>=6"]
dev = ["pytest>=8", "nbformat>=5", "nbclient>=0.10", "ipykernel>=6", "build>=1", "cmake>=4.2", "ninja>=1.11", "pybind11>=3.0", "scikit-build-core>=0.11"]

[tool.scikit-build]
cmake.version = ">=4.2"
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
wheel.packages = ["python/raytracing"]
sdist.include = ["antenna_patterns/simple_patch.ffs", "example1.ipynb", "example2.ipynb", "example1.py", "example2.py"]

[tool.scikit-build.cmake.define]
BUILD_TESTING = "OFF"
BUILD_BENCHMARKS = "OFF"

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.uv]
# Keep IDE launches on the explicitly installed wheel in the existing .venv.
# Native builds require the compiler environment and are run deliberately.
managed = false
